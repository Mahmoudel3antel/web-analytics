[project]
name = "web-analytics"
version = "0.1.0"
description = "A Python package for analyzing website traffic data and generating reports and visualizations."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
]

[build-system]
requires = ["uv_build>=0.11.18,<0.12.0"]
build-backend = "uv_build"